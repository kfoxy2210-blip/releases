# GitHub me yeh file `.github/workflows/build.yml` naam se banao (text copy-paste).
# Repo me zip upload karo (naam kuch bhi ho, jaise KPsApps1.zip) - 5 APK ban jayenge.
name: Build KP apps
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [KPs_Algo, KPs_Multi, KPs_Pine, KPs_Auto, KPs_Futures]
    steps:
      - uses: actions/checkout@v4
      - name: Zip kholo aur project folder dhoondo (zip/folder ka naam kuch bhi ho chalega)
        id: loc
        run: |
          for z in *.zip; do if [ -f "$z" ]; then unzip -oq "$z"; fi; done
          dir=$(find . -type d -name "${{ matrix.app }}" -not -path "./.git/*" | head -1)
          if [ -z "$dir" ]; then
            echo "ERROR: folder ${{ matrix.app }} nahi mila. Repo me ye files hain:"
            ls -R | head -60
            exit 1
          fi
          echo "Project folder: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'     # Chaquopy build python = 3.11 (pyc isi version ke hain)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: gradle assembleRelease --no-daemon
      - name: Rename APK
        run: |
          mkdir -p dist
          cp ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/release/*.apk "dist/${{ matrix.app }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}
          path: dist/${{ matrix.app }}.apk
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: KP apps build ${{ github.run_number }}
          files: dist/*.apk
